[project]
name = "medicallm-backend"
version = "0.1.0"
description = "MedicaLLM - Medical AI Assistant Backend"
readme = "README.md"
# Python 3.11 covers all the syntax used in the codebase (PEP 604 unions,
# `match` statements, etc.) and is widely available on managed Python hosts
# (DigitalOcean, AWS Lambda containers, Heroku). The previous `>=3.13`
# constraint was unnecessarily restrictive (audit I13).
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastapi>=0.119.1",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=6.3.0",
    "icecream>=2.1.8",
    "uvicorn[standard]>=0.38.0",
    "xsdata[cli,lxml]>=25.7",
    "pymed>=0.8.9",
    "tqdm>=4.1.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.0.0",
    "cachetools>=5.3.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
    "anthropic>=0.97.0",
    "openai>=2.31.0",
    "numpy>=1.24.0",
]
