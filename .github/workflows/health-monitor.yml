name: Health Monitor

# Runs every 5 minutes against production. Sends an alert email via Resend
# when the /health endpoint fails 3 consecutive checks (~15 minutes), and
# a recovery email on the first success after a downtime.
#
# Why 3 consecutive failures and not 1?
#   - GitHub-hosted runners share network with everyone; transient routing
#     glitches happen. 3-in-a-row is a strong signal something is actually
#     wrong, not just one flaky probe.
#   - One mail per outage instead of one per failed probe. Quiet inbox.
#
# State (currently_down: yes/no) is tracked via GitHub Actions cache
# keyed on a fixed string so successive runs can read the previous result.

on:
  schedule:
    # Every 5 minutes. Note: GitHub may delay scheduled runs by a few
    # minutes during peak load — that's expected, this is a monitor for
    # multi-minute outages, not 30-second blips.
    - cron: "*/5 * * * *"
  # Manual trigger for testing
  workflow_dispatch:

# Only one monitoring run at a time; concurrent runs would race on the
# state cache.
concurrency:
  group: health-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Restore previous state
        uses: actions/cache@v4
        id: state-restore
        with:
          path: state
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Read previous state
        id: prev
        run: |
          mkdir -p state
          if [ -f state/status.txt ]; then
            STATUS=$(cat state/status.txt)
            FAILS=$(cat state/fails.txt 2>/dev/null || echo "0")
          else
            STATUS="up"
            FAILS="0"
          fi
          echo "previous_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "previous_fails=$FAILS" >> "$GITHUB_OUTPUT"
          echo "Previous status: $STATUS (consecutive fails: $FAILS)"

      - name: Probe /health
        id: probe
        continue-on-error: true
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL || 'https://medicallm.com.tr/health' }}
        run: |
          set +e
          RESPONSE=$(curl --silent --show-error --max-time 15 \
            --write-out "\nHTTP_CODE:%{http_code}\n" \
            "$HEALTH_URL")
          CURL_EXIT=$?
          HTTP_CODE=$(echo "$RESPONSE" | grep "^HTTP_CODE:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/^HTTP_CODE:/d')

          echo "Curl exit: $CURL_EXIT"
          echo "HTTP code: $HTTP_CODE"
          echo "Response body:"
          echo "$BODY"

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=curl exit $CURL_EXIT (network or timeout)" >> "$GITHUB_OUTPUT"
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "$BODY" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          elif [ "$HTTP_CODE" != "200" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=HTTP $HTTP_CODE" >> "$GITHUB_OUTPUT"
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "$BODY" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "reason=ok" >> "$GITHUB_OUTPUT"
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            echo "$BODY" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next state
        id: state
        env:
          PROBE_OK: ${{ steps.probe.outputs.ok }}
          PROBE_REASON: ${{ steps.probe.outputs.reason }}
          PREV_STATUS: ${{ steps.prev.outputs.previous_status }}
          PREV_FAILS: ${{ steps.prev.outputs.previous_fails }}
        run: |
          set -e
          # Failure threshold — 3 consecutive failed probes = outage.
          # At 5-min cadence, this is ~15 minutes of downtime before alert.
          THRESHOLD=3

          if [ "$PROBE_OK" = "true" ]; then
            NEW_FAILS=0
            if [ "$PREV_STATUS" = "down" ]; then
              # We were marked down and the probe just succeeded → recovery.
              NEW_STATUS="up"
              ALERT="recovered"
            else
              NEW_STATUS="up"
              ALERT="none"
            fi
          else
            NEW_FAILS=$((PREV_FAILS + 1))
            if [ "$NEW_FAILS" -ge "$THRESHOLD" ] && [ "$PREV_STATUS" != "down" ]; then
              # Just crossed the threshold → first alert for this outage.
              NEW_STATUS="down"
              ALERT="down"
            elif [ "$PREV_STATUS" = "down" ]; then
              # Already alerted; stay quiet until recovery.
              NEW_STATUS="down"
              ALERT="none"
            else
              # Below threshold; could still be a transient blip.
              NEW_STATUS="up"
              ALERT="none"
            fi
          fi

          echo "new_status=$NEW_STATUS" >> "$GITHUB_OUTPUT"
          echo "new_fails=$NEW_FAILS" >> "$GITHUB_OUTPUT"
          echo "alert=$ALERT" >> "$GITHUB_OUTPUT"
          echo "Status: $NEW_STATUS (fails: $NEW_FAILS), alert: $ALERT"

      - name: Persist new state
        run: |
          mkdir -p state
          echo "${{ steps.state.outputs.new_status }}" > state/status.txt
          echo "${{ steps.state.outputs.new_fails }}" > state/fails.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > state/last_check.txt

      - name: Save state cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: monitor-state-${{ github.run_id }}

      - name: Send DOWN alert
        if: steps.state.outputs.alert == 'down'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM_ADDRESS || 'MedicaLLM Alerts <noreply@medicallm.com.tr>' }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          PROBE_REASON: ${{ steps.probe.outputs.reason }}
          PROBE_BODY: ${{ steps.probe.outputs.body }}
          HEALTH_URL: ${{ secrets.HEALTH_URL || 'https://medicallm.com.tr/health' }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_RECIPIENTS" ]; then
            echo "::error::Missing RESEND_API_KEY or ALERT_RECIPIENTS secret"
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          # ALERT_RECIPIENTS is a comma-separated list. Resend wants a JSON array.
          IFS=',' read -ra RECIPIENTS <<< "$ALERT_RECIPIENTS"
          RECIPIENTS_JSON=$(printf '"%s",' "${RECIPIENTS[@]}" | sed 's/,$//')

          # Escape the body for JSON. printf %s avoids backslash interpretation.
          BODY_ESCAPED=$(printf '%s' "$PROBE_BODY" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read())[1:-1])')

          PAYLOAD=$(cat <<EOF
          {
            "from": "$RESEND_FROM",
            "to": [$RECIPIENTS_JSON],
            "subject": "🚨 MedicaLLM is DOWN ($TIMESTAMP)",
            "html": "<h2 style='color:#dc2626'>MedicaLLM health check failed</h2><p><strong>Time:</strong> $TIMESTAMP</p><p><strong>URL:</strong> $HEALTH_URL</p><p><strong>Reason:</strong> $PROBE_REASON</p><p><strong>Response:</strong></p><pre style='background:#f1f5f9;padding:12px;border-radius:6px;font-size:12px;overflow:auto'>$BODY_ESCAPED</pre><p style='color:#64748b;font-size:12px;margin-top:24px'>Sent by GitHub Actions health monitor. You will receive a follow-up email when the service recovers.</p>"
          }
          EOF
          )

          echo "Sending alert to: $ALERT_RECIPIENTS"
          curl --fail --silent --show-error \
            -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Send RECOVERY alert
        if: steps.state.outputs.alert == 'recovered'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM_ADDRESS || 'MedicaLLM Alerts <noreply@medicallm.com.tr>' }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          HEALTH_URL: ${{ secrets.HEALTH_URL || 'https://medicallm.com.tr/health' }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$ALERT_RECIPIENTS" ]; then
            exit 0  # don't fail the workflow over a recovery email
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          IFS=',' read -ra RECIPIENTS <<< "$ALERT_RECIPIENTS"
          RECIPIENTS_JSON=$(printf '"%s",' "${RECIPIENTS[@]}" | sed 's/,$//')

          PAYLOAD=$(cat <<EOF
          {
            "from": "$RESEND_FROM",
            "to": [$RECIPIENTS_JSON],
            "subject": "✅ MedicaLLM recovered ($TIMESTAMP)",
            "html": "<h2 style='color:#22c55e'>MedicaLLM is back up</h2><p><strong>Time:</strong> $TIMESTAMP</p><p><strong>URL:</strong> $HEALTH_URL</p><p>The /health endpoint is responding 200 again.</p>"
          }
          EOF
          )

          curl --fail --silent --show-error \
            -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Fail the run on outage
        if: steps.state.outputs.new_status == 'down'
        run: |
          echo "::error::Production /health is failing. Check droplet logs."
          exit 1
