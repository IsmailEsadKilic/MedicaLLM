services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # ----------------------------------------------------------------------
      # Database (DigitalOcean Managed PostgreSQL).
      # The backend Settings class accepts both `DO_POSTGRES_URL` and
      # `POSTGRES_URL` env-var names (audit I3) — set whichever you have.
      # ----------------------------------------------------------------------
      - DO_POSTGRES_URL=${POSTGRES_URL:-${DO_POSTGRES_URL:-}}
      # Auth — JWT_SECRET MUST be set; the backend logs a warning if absent.
      - JWT_SECRET=${JWT_SECRET:-}
      # ----------------------------------------------------------------------
      # LLM (DigitalOcean AI). Both env-var aliases are supported (audit I2):
      #   MODEL_ACCESS_KEY (legacy compose) and DO_MODEL_ACCESS_KEY (config).
      # The model id is the same: DO_LLM_MODEL_ID is the canonical name.
      # ----------------------------------------------------------------------
      - DO_MODEL_ACCESS_KEY=${MODEL_ACCESS_KEY:-${DO_MODEL_ACCESS_KEY:-}}
      - DO_LLM_MODEL_ID=${DO_AI_MODEL:-${DO_LLM_MODEL_ID:-openai-gpt-oss-120b}}
      # Embeddings
      - HGF_EMBEDDING_MODEL_ID=${HGF_EMBEDDING_MODEL_ID:-nomic-ai/nomic-embed-text-v1}
      - HF_TOKEN=${HF_TOKEN:-}
      # PubMed / Scopus
      - SCOPUS_API_KEY=${SCOPUS_API_KEY:-}
      - NCBI_API_KEY=${NCBI_API_KEY:-}
      - OPENALEX_EMAIL=${OPENALEX_EMAIL:-}
      # Admin
      - ADMIN_USERNAME=${ADMIN_USERNAME:-medicallm}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # CORS — comma-separated list of frontend origins (audit I6).
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - APP_NAME=${APP_NAME:-MedicaLLM}
    volumes:
      - ./backend/data:/app/data
      - ./backend/chromadb-data:/app/chromadb-data
    networks:
      - internal
    restart: unless-stopped
    # Audit I5: defining the healthcheck here too means
    # `frontend.depends_on.condition: service_healthy` actually has something
    # to wait on. We re-state the values from the Dockerfile so an external
    # operator can tweak them without rebuilding the image.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=5); sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_HTTPS: ${VITE_USE_HTTPS:-false}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  internal:
    driver: bridge
