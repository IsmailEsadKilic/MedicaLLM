services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-}
      - DO_MODEL_ACCESS_KEY=${DO_MODEL_ACCESS_KEY:-}
      - DO_LLM_MODEL_ID=${DO_LLM_MODEL_ID:-openai-gpt-oss-120b}
      - SCOPUS_API_KEY=${SCOPUS_API_KEY:-}
      - SCOPUS_USE_FOR_CITATIONS=true
      - OPENALEX_ENABLED=${OPENALEX_ENABLED:-}
      - OPENALEX_EMAIL=${OPENALEX_EMAIL:-}
      - HF_EMBEDDING_MODEL_ID=${HF_EMBEDDING_MODEL_ID:-nomic-ai/nomic-embed-text-v1}
      - HF_TOKEN=${HF_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-medicallm}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DO_POSTGRES_URL=${DO_POSTGRES_URL:?missing DO_POSTGRES_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - NCBI_API_KEY=${NCBI_API_KEY:-}
    volumes:
      - ./backend/data:/app/data
      - ./backend/chromadb-data:/app/chromadb-data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=5); sys.exit(0 if r.status==200 else 1)"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_HTTPS: ${VITE_USE_HTTPS:-false}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  internal:
    driver: bridge
